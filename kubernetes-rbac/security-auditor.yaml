apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: security-auditor

rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs:
    - get
    - list
    - watch


apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: security-auditor

subjects:
- kind: Group
  name: security-team
  apiGroup: rbac.authorization.k8s.io

roleRef:
  kind: ClusterRole
  name: security-auditor
  apiGroup: rbac.authorization.k8s.io
