######################################
#DevOps Cluster Admin
######################################
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: devops-platform

subjects:
 - kind: Group
 - name: devops-team


- apiGroups: [""]
  resources:
    - pods
    - services
    - configmaps
    - secrets
    - namespaces
    - persistentvolumeclaims
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

- apiGroups:
    - apps
  resources:
    - deployments
    - daemonsets
    - statefulsets
    - replicasets
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

- apiGroups:
    - networking.k8s.io
  resources:
    - ingresses
  verbs:
    - "*"

-------------------------------------------------

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: devops-platform-binding

subjects:
- kind: Group
  name: devops-team
  apiGroup: rbac.authorization.k8s.io

roleRef:
  kind: ClusterRole
  name: devops-platform
  apiGroup: rbac.authorization.k8s.io



  
``
